# ============================================================
# android-llm-cli — Configuration template
# ============================================================
# Copy this file to ~/.config/a-llmcli/config.yaml
# (or run `a-llmcli` once to auto-create it).
# ============================================================

# ---- Default provider ----
default_provider: anthropic
default_mode: agent             # "chat" or "agent"

# ---- Environment ----
environment:
  type: termux                  # termux | linux | macos | windows | unknown
  include_builtin_context: true # prepend built-in Termux/Android context
  # extra_context: |            # custom instructions for the LLM
  #   User prefers concise explanations in Russian.

# ---- Security ----
security:
  mode: normal                  # "normal" or "hardcore"
  workspace_root: "$HOME/projects"

  # Normal mode: Smart auto-approval for safe operations (pwd, ls, git status, npm test, etc.)
  #              Confirmation required for risky operations (rm, install, curl, etc.)
  # Hardcore mode: Full auto-execution without confirmations (risky!)

# ---- Tools ----
tools:
  web_search:
    api_key: ${BRAVE_SEARCH_API_KEY}
    # Get a free API key at https://api.search.brave.com/app
    # 2000 free queries/month, no credit card required

# ---- Providers ----
providers:
  anthropic:
    type: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-6

  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o

  deepseek:
    type: openai
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat

  openrouter:
    type: openai
    api_key: ${OPENROUTER_API_KEY}
    base_url: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-4-6
